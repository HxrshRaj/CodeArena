# Local infrastructure for CodeArena.
#
# `docker compose up -d postgres redis` brings up just the datastores, which is
# all you need for `npm run dev`. The api / worker / web services are provided
# for a full containerised run and are documented in the README.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: codearena
      POSTGRES_PASSWORD: codearena
      POSTGRES_DB: codearena
    ports:
      - "5434:5432"
    volumes:
      - codearena-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codearena"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  codearena-pgdata:
